name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

      - name: Read release PR branch
        id: release-pr
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          head_branch="$(jq -r '.headBranchName // empty' <<< "$RELEASE_PR")"
          if [[ -z "$head_branch" ]]; then
            echo "Release Please reported a PR without a head branch." >&2
            exit 1
          fi
          echo "head_branch=$head_branch" >> "$GITHUB_OUTPUT"

      - name: Check out release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.release-pr.outputs.head_branch }}
          fetch-depth: 0

      - name: Set up Bun
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        run: bun install --frozen-lockfile

      - name: Format generated changelog
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          HEAD_BRANCH: ${{ steps.release-pr.outputs.head_branch }}
        run: |
          bunx oxfmt CHANGELOG.md
          if git diff --quiet -- CHANGELOG.md; then
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "chore: format generated changelog"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: Dispatch and verify release PR CI
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ steps.release-pr.outputs.head_branch }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          release_version="$(node -p "require('./package.json').version")"
          started_at="$(date -u -d '-1 minute' '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run ci.yml --ref "$HEAD_BRANCH" \
            --field base_ref=origin/main \
            --field pr_title="chore(main): release $release_version"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list --workflow ci.yml --event workflow_dispatch --limit 20 \
                --json databaseId,headSha,createdAt |
                jq --arg head_sha "$head_sha" --arg started_at "$started_at" -r \
                  '.[] | select(.headSha == $head_sha and .createdAt >= $started_at) | .databaseId' |
                head -n 1
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for CI on release PR head $head_sha." >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and verify npm publication
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          started_at="$(date -u -d '-1 minute' '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release.yml --ref main --field release_tag="$RELEASE_TAG"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list --workflow release.yml --event workflow_dispatch --limit 20 \
                --json databaseId,displayTitle,createdAt |
                jq --arg title "Publish $RELEASE_TAG" --arg started_at "$started_at" -r \
                  '.[] | select(.displayTitle == $title and .createdAt >= $started_at) | .databaseId' |
                head -n 1
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for release.yml to start for $RELEASE_TAG." >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
