name: Release Please

on:
  push:
    branches: [main]

concurrency:
  group: release-please-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          release-type: node

  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch and verify npm publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          started_at="$(date -u -d '-1 minute' '+%Y-%m-%dT%H:%M:%SZ')"
          gh workflow run release.yml --ref main --field release_tag="$RELEASE_TAG"

          run_id=""
          for attempt in {1..60}; do
            run_id="$(
              gh run list --workflow release.yml --event workflow_dispatch --limit 20 \
                --json databaseId,displayTitle,createdAt |
                jq --arg title "Publish $RELEASE_TAG" --arg started_at "$started_at" -r \
                  '.[] | select(.displayTitle == $title and .createdAt >= $started_at) | .databaseId' |
                head -n 1
            )"
            if [[ -n "$run_id" ]]; then
              break
            fi
            sleep 2
          done

          if [[ -z "$run_id" ]]; then
            echo "Timed out waiting for release.yml to start for $RELEASE_TAG." >&2
            exit 1
          fi

          gh run watch "$run_id" --exit-status
