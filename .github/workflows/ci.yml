name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Bun ${{ matrix.bun }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.1.0", "latest"]

    steps:
      - uses: actions/checkout@v7

      # Current Bun owns the text lockfile format; switch to the matrix version
      # after installing so the minimum supported runtime is still exercised.
      - name: Set up Bun for dependency install
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Set up Bun ${{ matrix.bun }}
        if: matrix.bun != 'latest'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}

      - name: Verify
        run: bun run verify

      - name: Verify generated skill references
        if: matrix.bun == 'latest'
        run: |
          bun run skill:docs
          git diff --exit-code -- skills/linear-sdk-cli

      - name: Smoke-test the package
        if: matrix.bun == 'latest'
        run: |
          bun pm pack --dry-run
          test "$(bun src/bin/linear.ts --version)" = "$(node -p "require('./package.json').version")"
          bun src/bin/linear.ts commands --json > /dev/null
